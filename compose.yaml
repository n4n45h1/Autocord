services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: autocord
      POSTGRES_USER: autocord
      POSTGRES_PASSWORD: autocord
    ports:
      - "5432:5432"
    volumes:
      - autocord-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autocord -d autocord"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  autocord-db:
