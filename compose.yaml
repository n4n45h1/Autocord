services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-autocord}
      POSTGRES_USER: ${POSTGRES_USER:-autocord}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autocord}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - autocord-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
  bot:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgres://autocord:autocord@postgres:5432/autocord}
      AI_BACKEND: ${AI_BACKEND_DOCKER:-openai-compatible}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "node dist/db/migrate.js && node dist/index.js"]
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
volumes:
  autocord-db:
